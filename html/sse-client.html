<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TTYD SSE Terminal</title>
    <style>
        body {
            font-family: 'Courier New', monospace;
            margin: 0;
            padding: 0;
            background-color: #1e1e1e;
            color: #f0f0f0;
        }
        .container {
            display: flex;
            flex-direction: column;
            height: 100vh;
            padding: 10px;
            box-sizing: border-box;
        }
        #terminal {
            flex: 1;
            background-color: #000;
            color: #f0f0f0;
            padding: 10px;
            overflow-y: auto;
            white-space: pre-wrap;
            font-size: 14px;
            border-radius: 5px;
            margin-bottom: 10px;
        }
        .input-container {
            display: flex;
            margin-bottom: 10px;
        }
        #input {
            flex: 1;
            padding: 8px;
            background-color: #2d2d2d;
            color: #f0f0f0;
            border: 1px solid #444;
            border-radius: 3px;
            font-family: 'Courier New', monospace;
        }
        button {
            margin-left: 5px;
            padding: 8px 15px;
            background-color: #0078d7;
            color: white;
            border: none;
            border-radius: 3px;
            cursor: pointer;
        }
        button:hover {
            background-color: #0063b1;
        }
        .controls {
            display: flex;
            margin-bottom: 10px;
        }
        .controls button {
            margin-right: 5px;
        }
        .status {
            padding: 5px;
            font-size: 12px;
            color: #888;
        }
    </style>
</head>
<body>
    <div class="container">
        <h2>TTYD HTTP/SSE Terminal</h2>
        <div class="controls">
            <button id="connect">Connect</button>
            <button id="disconnect">Disconnect</button>
            <button id="clear">Clear</button>
        </div>
        <div class="status" id="status">Disconnected</div>
        <div id="terminal"></div>
        <div class="input-container">
            <input type="text" id="input" placeholder="Type command and press Enter">
            <button id="send">Send</button>
        </div>
    </div>

    <script>
        const terminal = document.getElementById('terminal');
        const input = document.getElementById('input');
        const sendBtn = document.getElementById('send');
        const connectBtn = document.getElementById('connect');
        const disconnectBtn = document.getElementById('disconnect');
        const clearBtn = document.getElementById('clear');
        const statusEl = document.getElementById('status');
        
        let eventSource = null;
        let terminalId = null;
        
        // Function to create a random terminal ID
        function generateTerminalId() {
            return Math.random().toString(36).substring(2, 15);
        }
        
        // Function to connect to the SSE endpoint
        function connect() {
            if (eventSource) {
                eventSource.close();
            }
            
            terminalId = generateTerminalId();
            const url = `/sse/${terminalId}`;
            
            statusEl.textContent = `Connecting to ${url}...`;
            
            eventSource = new EventSource(url);
            
            eventSource.addEventListener('open', (event) => {
                statusEl.textContent = `Connected to terminal ${terminalId}`;
                terminal.innerHTML += '<div style="color: #0f0;">Connected to terminal.</div>';
            });
            
            eventSource.addEventListener('output', (event) => {
                // Decode base64 output
                const decoded = atob(event.data);
                
                // Convert to HTML-safe string
                const safe = decoded
                    .replace(/&/g, '&amp;')
                    .replace(/</g, '&lt;')
                    .replace(/>/g, '&gt;')
                    .replace(/"/g, '&quot;')
                    .replace(/'/g, '&#039;');
                
                terminal.innerHTML += safe;
                terminal.scrollTop = terminal.scrollHeight;
            });
            
            eventSource.addEventListener('close', (event) => {
                statusEl.textContent = `Terminal closed: ${event.data}`;
                terminal.innerHTML += `<div style="color: #f00;">Terminal closed: ${event.data}</div>`;
                disconnect();
            });
            
            eventSource.addEventListener('error', (event) => {
                statusEl.textContent = 'Connection error';
                terminal.innerHTML += '<div style="color: #f00;">Connection error. Reconnecting...</div>';
                
                // Auto-reconnect is handled by the browser for SSE
            });
        }
        
        // Function to disconnect from the SSE endpoint
        function disconnect() {
            if (eventSource) {
                eventSource.close();
                eventSource = null;
                statusEl.textContent = 'Disconnected';
            }
        }
        
        // Function to send input to the terminal
        function sendInput() {
            if (!eventSource || !terminalId) {
                terminal.innerHTML += '<div style="color: #f00;">Not connected to a terminal.</div>';
                return;
            }
            
            const text = input.value;
            if (!text) return;
            
            fetch(`/api/terminal/${terminalId}/input`, {
                method: 'POST',
                body: text,
                headers: {
                    'Content-Type': 'text/plain'
                }
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP error ${response.status}`);
                }
                return response.json();
            })
            .then(data => {
                input.value = '';
            })
            .catch(error => {
                terminal.innerHTML += `<div style="color: #f00;">Error sending input: ${error.message}</div>`;
            });
        }
        
        // Function to resize the terminal
        function resizeTerminal(cols, rows) {
            if (!eventSource || !terminalId) {
                terminal.innerHTML += '<div style="color: #f00;">Not connected to a terminal.</div>';
                return;
            }
            
            fetch(`/api/terminal/${terminalId}/resize`, {
                method: 'POST',
                body: JSON.stringify({ columns: cols, rows: rows }),
                headers: {
                    'Content-Type': 'application/json'
                }
            })
            .then(response => {
                if (!response.ok) {
                    throw new Error(`HTTP error ${response.status}`);
                }
                return response.json();
            })
            .then(data => {
                terminal.innerHTML += `<div style="color: #0f0;">Terminal resized to ${cols}x${rows}</div>`;
            })
            .catch(error => {
                terminal.innerHTML += `<div style="color: #f00;">Error resizing terminal: ${error.message}</div>`;
            });
        }
        
        // Event listeners
        connectBtn.addEventListener('click', connect);
        disconnectBtn.addEventListener('click', disconnect);
        clearBtn.addEventListener('click', () => {
            terminal.innerHTML = '';
        });
        
        sendBtn.addEventListener('click', sendInput);
        
        input.addEventListener('keydown', (event) => {
            if (event.key === 'Enter') {
                sendInput();
            }
        });
        
        // Handle special keys
        input.addEventListener('keydown', (event) => {
            // Ctrl+C
            if (event.ctrlKey && event.key === 'c') {
                if (eventSource && terminalId) {
                    fetch(`/api/terminal/${terminalId}/input`, {
                        method: 'POST',
                        body: '\x03', // Ctrl+C character
                        headers: {
                            'Content-Type': 'text/plain'
                        }
                    });
                }
            }
        });
        
        // Auto-resize terminal on window resize
        window.addEventListener('resize', () => {
            // Calculate approximate terminal size based on container size
            // This is a very rough estimate
            const cols = Math.floor(terminal.clientWidth / 8);
            const rows = Math.floor(terminal.clientHeight / 16);
            
            if (cols > 0 && rows > 0 && eventSource && terminalId) {
                resizeTerminal(cols, rows);
            }
        });
    </script>
</body>
</html>
